# Antora Assembler (@antora/pdf-extension 1.x) config for default-pdf.yml.
# Exports one PDF: the site's one component (the hub and every workshop), in nav order.
component_version_filter:
  names: '*'
assembly:
  root_level: 0
  attributes:
    source-highlighter: rouge
    outlinelevels: 3
build:
  command: bundle exec asciidoctor-pdf -r ../workshop-common/pdf/workshop-pdf.rb
