# Antora Assembler (@antora/pdf-extension 1.x) config for default-pdf-exports.yml.
# Exports one PDF: the openshift-102 component, whose nav lib/pdf-bundle-nav.js extends with
# every bundled workshop's pages.
component_version_filter:
  names: openshift-102
assembly:
  root_level: 0
  attributes:
    source-highlighter: rouge
    outlinelevels: 3
    # The PDF is built from the openshift-102 component, so the bundled workshops' own
    # attributes don't apply; repeat the ones their pages use. Keep these in step with
    # workshops/istio-workshop/antora.yml.
    istio_version: "1.30"
    ossm_version: "3.4"
    istio_revision: default
build:
  command: bundle exec asciidoctor-pdf -r ../workshop-common/pdf/workshop-pdf.rb
