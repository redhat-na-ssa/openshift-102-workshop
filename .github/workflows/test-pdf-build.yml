name: Test PDF Build
# Builds the combined workshop PDF (same playbook as the release) on pull requests with the shared workflow in shpwrck/workshop-common.
on:
  pull_request:
    paths:
      - 'content/**'
      - 'workshops/**'
      - 'lib/**'
      - 'default-pdf-exports.yml'
      - 'antora-assembler.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
  workflow_dispatch:  # Allow manual testing

permissions:
  contents: read

jobs:
  test-build:
    uses: shpwrck/workshop-common/.github/workflows/pdf-test.yml@main
    with:
      playbook: default-pdf-exports.yml
      output-dir: www-pdf-exports
      single-pdf: true
