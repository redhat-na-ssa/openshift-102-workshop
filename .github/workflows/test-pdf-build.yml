name: Test PDF Build
# Builds the combined workshop PDF (same playbook as the release) on pull requests with the shared workflow in redhat-na-ssa/workshop-common.
on:
  pull_request:
    paths:
      - 'content/**'
      - 'workshops/**'
      - 'default-pdf.yml'
      - 'antora-assembler.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
  workflow_dispatch:  # Allow manual testing

permissions:
  contents: read

jobs:
  test-build:
    uses: redhat-na-ssa/workshop-common/.github/workflows/pdf-test.yml@main
    with:
      playbook: default-pdf.yml
      output-dir: www-pdf-exports
      single-pdf: true
