---
site:
  title: OpenShift 102 Workshop
  # Served at the root of the runtime image's route; the Pages workflow passes
  # --url with the GitHub Pages address (https://redhat-na-ssa.github.io/openshift-102-workshop).
  url: "https://example.com"
  start_page: ROOT::index.adoc

asciidoc:
  attributes:
    # Workshop tools image (Dockerfile.tools); override when building for another registry or tag.
    tools-image-basename: ghcr.io/redhat-na-ssa/openshift-102-tools
    tools-image-tag: latest

content:
  sources:
    # Each workshop under workshops/, then the home part, which must stay last.
    - url: .
      start_path: workshops/helm
    - url: .
      start_path: workshops/deploy
    - url: .
      start_path: workshops/istio
    - url: .
      start_path: workshops/prometheus
    # add-workshop.py adds workshops above this line
    - url: .
      start_path: content

ui:
  bundle:
    # Showroom theme plus the shared workshop CSS, tabs, copy buttons and footer stamp;
    # see https://github.com/shpwrck/workshop-common
    url: https://github.com/shpwrck/workshop-common/releases/download/ui-bundle/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www
