---
# Deprecated: incomplete playbook (no bundled workshops). For PDF exports, use
# `default-pdf-exports.yml` and `antora generate default-pdf-exports.yml` (see release workflow).
site:
  title: OpenShift 102 Workshop
  url: "https://example.com"
  start_page: master@openshift-102:ROOT:index.adoc

content:
  sources:
    - url: .
      start_path: content/openshift-102
    - url: .
      start_path: workshops/helm-workshop
    - url: .
      start_path: workshops/deploy-workshop
    - url: .
      start_path: workshops/istio-workshop
    - url: .
      start_path: workshops/prometheus-workshop

ui:
  bundle:
    # Showroom theme plus the shared workshop CSS, tabs, copy buttons and footer stamp;
    # see https://github.com/redhat-na-ssa/workshop-common
    url: https://github.com/redhat-na-ssa/workshop-common/releases/download/ui-bundle/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - "@antora/pdf-extension"
    - require: ./content/openshift-102/lib/dev-mode.js
      enabled: false

output:
  dir: ./www
