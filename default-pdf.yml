---
# Deprecated: incomplete playbook (no bundled workshops). For PDF exports, use
# `default-pdf-exports.yml` and `antora generate default-pdf-exports.yml` (see release workflow).
site:
  title: OpenShift 102 Workshop
  url: "https://example.com"
  start_page: master@openshift-102:ROOT:index.adoc

content:
  sources:
    - url: .
      start_path: content/openshift-102
    - url: .
      start_path: workshops/helm-workshop
    - url: .
      start_path: workshops/deploy-workshop
    - url: .
      start_path: workshops/istio-workshop
    - url: .
      start_path: workshops/prometheus-workshop

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v0.0.1/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/openshift-102/supplemental-ui
    - path: css/site-extra.css
      contents: ./content/openshift-102/supplemental-ui/css/site-extra.css
    - path: partials/head-meta.hbs
      contents: ./content/openshift-102/supplemental-ui/partials/head-meta.hbs
    - path: partials/footer.hbs
      contents: ./content/openshift-102/supplemental-ui/partials/footer.hbs
    - path: partials/build-info.hbs
      contents: ./content/openshift-102/supplemental-ui/partials/build-info.hbs
    - path: img/favicon.ico
      contents: ./content/openshift-102/supplemental-ui/img/favicon.ico
    - path: ./content/openshift-102/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - "@antora/pdf-extension"
    - require: ./content/openshift-102/lib/dev-mode.js
      enabled: false

output:
  dir: ./www
