# Gitleaks configuration for the OpenShift 102 workshops (merged from the four
# workshops' own configs when they were folded into this repository).
#
# Keeps every built-in gitleaks rule and adds a rule for hard-coded
# passwords. Workshop content contains a few placeholder passwords and demo
# tokens on purpose; each one is allowlisted below by its exact value, so
# any other password or token still fails the scan.
#
# Run locally:
#   gitleaks git --config .gitleaks.toml .
#   gitleaks dir --config .gitleaks.toml .

title = "Workshop gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "hardcoded-password"
description = "Password written as a literal value in YAML, a shell variable or a CLI flag"
regex = '''(?i)(?:--[\w-]*(?:passw(?:or)?d|passwd)(?:=|[ \t]+)|\b[\w.-]*(?:passw(?:or)?d|passwd|sshpass)[\w.-]*["']?[ \t]*[:=][ \t]*)["']?([^\s"'`$\\{}()<>|#,;\[\]]{3,})'''
secretGroup = 1
keywords = ["pass"]

[[rules.allowlists]]
description = "Placeholder passwords used in the workshop content"
regexTarget = "secret"
regexes = [
  # ssh_password default from the Showroom template (content/antora.yml, removed since)
  '''^devops$''',
  # docker-registry pull secret example (deploy workshop)
  '''^mypassword$''',
]

# Istio workshop: Istio's public demo JWT (iss/sub testing@secure.istio.io, claim foo=bar),
# published in the Istio docs and used for the RequestAuthentication exercise.
